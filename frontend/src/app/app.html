<main class="app-shell">
  <app-header [isDarkMode]="isDarkMode" (toggleTheme)="toggleTheme()" />

  <div class="workspace">
    <app-image-upload
      [selectedFile]="selectedFile"
      [previewUrl]="previewUrl"
      [imageDimensions]="imageDimensions"
      [uploadError]="uploadError"
      (fileSelected)="loadImage($event)"
      (imageDropped)="loadImage($event)"
      (imageCleared)="clearImage()"
    />

    <app-simulation-controls
      [previewUrl]="previewUrl"
      [codecOptions]="codecOptions"
      [selectedCodecDescription]="selectedCodecDescription"
      [simulationMessage]="simulationMessage"
      [(codec)]="codec"
      [(noiseModel)]="noiseModel"
      [(errorProbability)]="errorProbability"
      [(burstLength)]="burstLength"
      [(burstCount)]="burstCount"
      [(randomSeed)]="randomSeed"
      (simulationStarted)="startSimulation()"
    />
  </div>
</main>
