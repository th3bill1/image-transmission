<header class="app-header">
  <div>
    <p class="eyebrow">{{ translation.translate('app.eyebrow') }}</p>
    <p class="subheading">{{ translation.translate('app.subheading') }}</p>
    <h1>{{ translation.translate('app.title') }}</h1>
    <p class="intro">{{ translation.translate('app.intro') }}</p>
  </div>
  <div class="header-actions">
    <span class="step-badge">{{
      translation.translate('app.step', { step: currentStep() })
    }}</span>
    <button
      class="utility-button"
      type="button"
      [attr.aria-label]="translation.translate('app.switchLanguage')"
      (click)="toggleLanguage()"
    >
      {{
        translation.translate(
          translation.currentLocale === 'en' ? 'app.languagePolish' : 'app.languageEnglish'
        )
      }}
    </button>
    <button
      class="utility-button theme-button"
      type="button"
      [attr.aria-label]="translation.translate('app.switchTheme')"
      (click)="toggleTheme.emit()"
    >
      <span aria-hidden="true">{{
        translation.translate(isDarkMode() ? 'app.lightModeIcon' : 'app.darkModeIcon')
      }}</span>
    </button>
  </div>
</header>
